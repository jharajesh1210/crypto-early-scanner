name: Crypto Paper Trading

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-paper-trading
  cancel-in-progress: true

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Paper Trading Tracker
        run: |
          python crypto_paper_trading.py

      - name: Save Paper Trading Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_paper_trading.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update crypto paper trading results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No paper trading changes to save."
          fi
