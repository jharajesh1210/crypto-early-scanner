name: V10 Futures Paper Trading

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions UTC time use करता है.
    # हर 5 मिनट run करने की कोशिश करेगा.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: v10-futures-paper-trading
  cancel-in-progress: false

jobs:
  v10-paper-trading:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================
      # 1. REPOSITORY CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. INSTALL PACKAGES
      # ======================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests


      # ======================================================
      # 4. RUN V10 PAPER TRADING
      # ======================================================

      - name: Run V10 Futures Paper Trading
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python crypto_futures_v10_paper.py


      # ======================================================
      # 5. SAVE PAPER TRADING FILES
      # ======================================================

      - name: Commit paper trading results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_futures_v10_paper.csv || true
          git add crypto_futures_v10_paper_signals.csv || true
          git add crypto_futures_v10_paper_state.json || true

          if git diff --cached --quiet; then
            echo "No V10 paper trading changes to commit."
          else
            git commit -m "Update V10 futures paper trading"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi


      # ======================================================
      # 6. FINAL STATUS
      # ======================================================

      - name: Paper trading status
        if: always()
        run: |
          echo "========================================"
          echo "V10 FUTURES PAPER TRADING COMPLETE"
          echo "Strategy: V10_EMA20_RISING3"
          echo "Paper Test: RR 1:2 and RR 1:3"
          echo "BB Squeeze: observation only"
          echo "NO REAL ORDERS"
          echo "========================================"
