name: Crypto Futures Historical V16

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-futures-historical-v16
  cancel-in-progress: true

jobs:
  futures-historical-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Futures Historical V16
        run: |
          python crypto_futures_historical_v16.py

      - name: Save V16 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_futures_v16_events.csv 2>/dev/null || true
          git add crypto_futures_v16_win_loss_profile.csv 2>/dev/null || true
          git add crypto_futures_v16_discovery.csv 2>/dev/null || true
          git add crypto_futures_v16_selection.csv 2>/dev/null || true
          git add crypto_futures_v16_final_holdout.csv 2>/dev/null || true
          git add crypto_futures_v16_summary.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update futures historical V16 results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No V16 result changes to save."
          fi
