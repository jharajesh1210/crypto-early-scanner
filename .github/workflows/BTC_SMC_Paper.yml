
name: BTC_SMC_Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-smc-paper
  cancel-in-progress: false

jobs:
  paper_scanner:
    name: Run BTC SMC Paper Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run BTC SMC Paper Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -u BTC_SMC_Paper.py

      - name: Upload paper trading results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC_SMC_Paper_Results
          path: |
            BTC_SMC_Paper_state.json
            BTC_SMC_Paper_trades.csv
          if-no-files-found: warn

      - name: Commit paper trading state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f BTC_SMC_Paper_state.json ]; then
            git add -f BTC_SMC_Paper_state.json
          fi

          if [ -f BTC_SMC_Paper_trades.csv ]; then
            git add -f BTC_SMC_Paper_trades.csv
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update BTC SMC paper trading state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No paper trading changes to commit"
          fi
