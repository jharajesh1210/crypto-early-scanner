name: BTC Futures V23 Pure SMC Paper
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: v23-smc-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install numpy pandas requests
      - name: Run V23 paper scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u crypto_futures_v23_smc_paper.py
      - name: Save V23 results to repo
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in crypto_futures_v23_smc_state.json crypto_futures_v23_smc_trades.csv crypto_futures_v23_smc_signals.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update V23 SMC paper results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload V23 CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v23-smc-${{ github.run_number }}
          path: |
            crypto_futures_v23_smc_state.json
            crypto_futures_v23_smc_trades.csv
            crypto_futures_v23_smc_signals.csv
          if-no-files-found: warn
