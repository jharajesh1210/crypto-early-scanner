name: CoinDCX Futures API Test

on:
  workflow_dispatch:

jobs:
  futures-api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test CoinDCX Futures API
        run: |
          python test_coindcx_futures.py
