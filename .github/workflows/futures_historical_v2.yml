name: Crypto Futures Historical V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  futures-historical-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Futures Historical V2
        run: |
          python crypto_futures_historical_v2.py

      - name: Save V2 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_futures_historical_v2_results.csv 2>/dev/null || true
          git add crypto_futures_v2_summary.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update futures V2 optimization results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No V2 result changes."
          fi
