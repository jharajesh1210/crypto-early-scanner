name: Crypto Futures Historical V14

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-futures-historical-v14
  cancel-in-progress: true

jobs:
  futures-historical-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Futures Historical V14
        run: |
          python crypto_futures_historical_v14.py

      - name: Save V14 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_futures_v14_events.csv 2>/dev/null || true
          git add crypto_futures_v14_win_loss_profile.csv 2>/dev/null || true
          git add crypto_futures_v14_results.csv 2>/dev/null || true
          git add crypto_futures_v14_summary.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update futures historical V14 results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No V14 result changes to save."
          fi
