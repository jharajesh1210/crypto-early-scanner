
name: V10 Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Test Message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          token = os.environ.get("BOT_TOKEN", "")
          chat_id = os.environ.get("CHAT_ID", "")

          if not token or not chat_id:
              raise SystemExit("BOT_TOKEN or CHAT_ID missing")

          message = (
              "V10 TELEGRAM TEST SUCCESS\n"
              "BTC Futures Three-Strategy Paper Scanner\n"
              "Telegram connection is working.\n"
              "This is a TEST, not a trade."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(
              url, data=data, method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise SystemExit("Telegram API returned failure")

          print("TELEGRAM TEST MESSAGE SENT SUCCESSFULLY")
          PY
