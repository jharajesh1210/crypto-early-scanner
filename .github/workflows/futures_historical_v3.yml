name: Crypto Futures Historical V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  futures-historical-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Futures Historical V3
        run: |
          python crypto_futures_historical_v3.py

      - name: Save V3 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_futures_v3_results.csv 2>/dev/null || true
          git add crypto_futures_v3_summary.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update futures V3 validation results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No V3 result changes."
          fi
