name: Crypto Historical Learning

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-historical-learning
  cancel-in-progress: false

jobs:
  historical-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Next Historical Batch
        run: |
          python crypto_historical_learning.py

      - name: Save Historical Model
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_6month_patterns.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto update 6-month historical model"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new historical models to save."
          fi
