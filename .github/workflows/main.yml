name: Crypto Early Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Test CoinDCX API
        run: |
          python -c "import requests; r=requests.get('https://api.coindcx.com/exchange/v1/markets', timeout=20); print('CoinDCX Status:', r.status_code); print('Markets found:', len(r.json())); r.raise_for_status()"

      - name: Run Crypto Early Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python crypto_early_alert.py
