name: Crypto Early Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Test CoinDCX API
        run: |
          python -c "import requests; r=requests.get('https://api.coindcx.com/exchange/v1/markets', timeout=20); print('CoinDCX Status:', r.status_code); print('Markets found:', len(r.json())); r.raise_for_status()"

      - name: Run Crypto Early Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python crypto_early_alert.py

      - name: Save Telegram alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_early_alerted_signals.csv || true
          git diff --cached --quiet || git commit -m "Update Telegram alert state"
          git push
