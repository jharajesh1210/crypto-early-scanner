name: Crypto SMC V2 POC Paper Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
concurrency:
  group: crypto-smc-v2-poc-paper
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install requests
      - name: Run SMC V2 paper scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python CRYPTO_SMC_V2_POC_PAPER.py
      - name: Save state and paper CSVs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f CRYPTO_SMC_V2_POC_PAPER_state.json CRYPTO_SMC_V2_POC_PAPER_trades.csv CRYPTO_SMC_V2_POC_PAPER_signals.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update SMC V2 paper state and trades'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
