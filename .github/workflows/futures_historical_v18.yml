name: Crypto Futures Historical V18

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-futures-historical-v18
  cancel-in-progress: true

jobs:
  futures-historical-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Futures Historical V18
        run: |
          python crypto_futures_historical_v18.py

      - name: Save V18 Results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crypto_futures_v18_events.csv 2>/dev/null || true
          git add crypto_futures_v18_folds.csv 2>/dev/null || true
          git add crypto_futures_v18_configs.csv 2>/dev/null || true
          git add crypto_futures_v18_summary.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update futures historical V18 results"
            git pull --rebase origin main
            git push origin main
          else
            echo "No V18 result changes to save."
          fi
