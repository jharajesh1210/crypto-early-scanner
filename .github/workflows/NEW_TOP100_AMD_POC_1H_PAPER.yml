name: NEW TOP100 AMD POC 1H Paper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: new-top100-amd-poc-1h-paper
  cancel-in-progress: false

jobs:
  paper_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pandas numpy requests

      - name: Run NEW TOP100 AMD POC paper scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python NEW_TOP100_AMD_POC_1H_PAPER.py

      - name: Save NEW paper trading history
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            TOP100_AMD_POC_1H_PAPER_state.json \
            TOP100_AMD_POC_1H_PAPER_trades.csv \
            TOP100_AMD_POC_1H_PAPER_signals.csv \
            TOP100_AMD_POC_1H_PAPER_universe.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No paper data changes to save'
            exit 0
          fi
          git commit -m 'Update NEW TOP100 AMD POC 1H paper history'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Conflict: preserving existing paper history; no force push'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Paper trading data saved'
              exit 0
            fi
            sleep 3
          done
          echo 'Could not save history after retries'
          exit 1
