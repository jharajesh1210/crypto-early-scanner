
name: TOP100 NEWS IMPACT V2 PAPER

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: top100-news-impact-v2
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy

      - name: Verify scanner files
        run: |
          test -f TOP100_CRIPTO_AMC_POC_NEWS_IMPACT.py
          test -f NEWS_IMPACT_ENGINE.py
          python -m py_compile \
            TOP100_CRIPTO_AMC_POC_NEWS_IMPACT.py \
            NEWS_IMPACT_ENGINE.py

      - name: Run TOP100 News Impact scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWS_CALENDAR_URL: ${{ secrets.NEWS_CALENDAR_URL }}
        run: |
          python -u TOP100_CRIPTO_AMC_POC_NEWS_IMPACT.py

      - name: Save paper trading files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking generated paper files..."

          ls -la TOP100_CRIPTO_AMC_POC_NEWS_IMPACT* || true

          git add -A -- \
            ':(glob)TOP100_CRIPTO_AMC_POC_NEWS_IMPACT_*.json' \
            ':(glob)TOP100_CRIPTO_AMC_POC_NEWS_IMPACT_*.csv' \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes staged. Checking state file..."

            if [ -f TOP100_CRIPTO_AMC_POC_NEWS_IMPACT_state.json ]; then
              git add -f TOP100_CRIPTO_AMC_POC_NEWS_IMPACT_state.json
            fi
          fi

          if git diff --cached --quiet; then
            echo "No new paper files to save"
          else
            git commit -m "Update TOP100 News Impact V2 paper state"

            for attempt in 1 2 3; do
              if git push; then
                echo "PAPER FILES SAVED SUCCESSFULLY"
                exit 0
              fi

              echo "Push attempt $attempt failed"
              sleep 5
            done

            echo "ERROR: Paper files could not be pushed"
            exit 1
          fi

      - name: Verify state file
        if: always()
        run: |
          if [ -f TOP100_CRIPTO_AMC_POC_NEWS_IMPACT_state.json ]; then
            echo "STATE FILE EXISTS"
            ls -lh TOP100_CRIPTO_AMC_POC_NEWS_IMPACT_state.json
          else
            echo "WARNING: STATE FILE NOT FOUND"
            exit 1
          fi
