
name: Crypto Futures V21 Live Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-futures-v21-paper
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Check Python file
        run: |
          test -f crypto_futures_live_1h_15m_v21_rr2.py
          python -m py_compile crypto_futures_live_1h_15m_v21_rr2.py

      - name: Run V21 Paper Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u crypto_futures_live_1h_15m_v21_rr2.py

      - name: Save Paper Trading State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_1h15m_state.json 2>/dev/null || true
          git add live_1h15m_trades.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update V21 paper trading state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Paper Trading Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-paper-results-${{ github.run_number }}
          path: |
            live_1h15m_state.json
            live_1h15m_trades.csv
          if-no-files-found: warn
          retention-days: 30
