name: BTC Futures V10 Three Strategies Paper
on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: write
concurrency:
  group: btc-v10-3strategy-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas requests
      - name: Run three-strategy paper scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u crypto_futures_v10_3strategy_paper.py
      - name: Save paper CSV and state
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in crypto_futures_v10_3strategy_paper.csv crypto_futures_v10_3strategy_signals.csv crypto_futures_v10_3strategy_state.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update V10 three-strategy paper results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Downloadable paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-v10-three-strategies-${{ github.run_number }}
          path: |
            crypto_futures_v10_3strategy_paper.csv
            crypto_futures_v10_3strategy_signals.csv
            crypto_futures_v10_3strategy_state.json
          if-no-files-found: warn
