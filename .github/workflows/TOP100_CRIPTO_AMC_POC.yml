
name: TOP100 CRIPTO AMC POC Paper Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: top100-cripto-amc-poc
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests

      - name: Test TOP100 Telegram
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("BOT_TOKEN")
          chat = os.environ.get("CHAT_ID")

          if not token or not chat:
              raise RuntimeError(
                  "BOT_TOKEN or CHAT_ID is missing"
              )

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat,
                  "text": (
                      "TOP100 Scanner Telegram "
                      "TEST SUCCESS - PAPER ONLY"
                  )
              },
              timeout=20
          )

          response.raise_for_status()

          if not response.json().get("ok"):
              raise RuntimeError(
                  "Telegram did not confirm success"
              )

          print("TOP100 Telegram test sent successfully")
          PY

      - name: Run TOP100 Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python TOP100_CRIPTO_AMC_POC.py

      - name: Save paper trading files to GitHub
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=(
            TOP100_CRIPTO_AMC_POC_state.json
            TOP100_CRIPTO_AMC_POC_trades.csv
            TOP100_CRIPTO_AMC_POC_signals.csv
            TOP100_CRIPTO_AMC_POC_universe.csv
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No paper trading file changes"
            exit 0
          fi

          git commit -m "Update TOP100 paper trading data"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              echo "Stopping to protect paper trading data."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Paper trading data saved successfully"
              exit 0
            fi

            echo "Push rejected. Retrying..."
            sleep 5
          done

          echo "ERROR: Could not save paper trading data."
          exit 1
